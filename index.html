</style></head><body><div class="app"><aside id="sidebar"><button class="menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Уроки</button><div class="brand">א <span>Alef</span></div><p class="muted intro">Современный иврит · от полного нуля</p><div class="progress"><div id="bar"></div></div><p class="muted pct" id="pct"></p><div class="navlist" id="navlist"></div></aside><main id="content"></main></div><script>
const lessons=[{"id": 1, "section": "Основы", "title": "Как устроен иврит", "subtitle": "Направление письма, современный иврит, буквы и огласовки", "explanation": "Иврит пишут и читают справа налево. В алфавите 22 основные буквы. Большинство повседневных текстов пишут без огласовок — маленьких знаков, уточняющих гласные. В начале мы используем огласовки и транскрипцию, затем постепенно убираем их.", "hebrew": "שלום", "pron": "шалом", "translation": "Привет / мир", "question": "Как читают строки на иврите?", "answer": "Справа налево", "options": ["Слева направо", "Справа налево", "Снизу вверх"]}, {"id": 2, "section": "Алфавит", "title": "Первые буквы: א ב ג ד ה ו", "subtitle": "Алеф, бет, гимель, далет, хей, вав", "explanation": "א (алеф) часто обозначает носитель гласного; בּ (б) / ב (в); ג (г); ד (д); ה (х/гортанное h); ו (в, иногда о/у). Точки внутри некоторых букв меняют произношение. Начинай с узнавания формы и звука, а не с быстрого чтения.", "hebrew": "אַבָּא", "pron": "аба", "translation": "Папа", "question": "Какая буква обычно передаёт звук «г»?", "answer": "ג", "options": ["ד", "ג", "ה"]}, {"id": 3, "section": "Алфавит", "title": "Буквы ז ח ט י כ ל", "subtitle": "Зайн, хет, тет, йод, каф, ламед", "explanation": "ז (з); ח (глубокий х); ט (т); י (й, иногда и); כּ (к), כ (х); ל (л). Обрати внимание: хет и каф без точки часто звучат похоже, но пишутся по-разному.", "hebrew": "יָד", "pron": "яд", "translation": "Рука", "question": "Какая буква передаёт звук «л»?", "answer": "ל", "options": ["י", "ל", "ז"]}, {"id": 4, "section": "Алфавит", "title": "Буквы מ נ ס ע פ צ", "subtitle": "Мем, нун, самех, айн, пе, цади", "explanation": "מ (м); נ (н); ס (с); ע (айн, в современной речи часто без отдельного согласного звука); פּ (п), פ (ф); צ (ц). В иврите форма буквы может меняться в конце слова.", "hebrew": "מַיִם", "pron": "маим", "translation": "Вода", "question": "Какая буква передаёт звук «ц»?", "answer": "צ", "options": ["ס", "פ", "צ"]}, {"id": 5, "section": "Алфавит", "title": "Последние буквы ק ר ש ת", "subtitle": "Куф, реш, шин/син, тав", "explanation": "ק (к); ר (р, часто заднеязычный); שׁ (ш) / שׂ (с); ת (т). Это завершает знакомство с 22 основными буквами. Для ש точка справа означает «ш», слева — «с».", "hebrew": "שָׁלוֹם", "pron": "шалом", "translation": "Привет / мир", "question": "Как читается שׁ?", "answer": "ш", "options": ["с", "ш", "т"]}, {"id": 6, "section": "Чтение", "title": "Пять конечных букв", "subtitle": "ך ם ן ף ץ", "explanation": "Пять букв меняют форму в конце слова: כ→ך, מ→ם, נ→ן, פ→ף, צ→ץ. Это не новые звуки, а позиционные формы. Например, מ в начале и ם в конце.", "hebrew": "שֵׁם", "pron": "шем", "translation": "Имя", "question": "Какая конечная форма у מ?", "answer": "ם", "options": ["ן", "ם", "ץ"]}, {"id": 7, "section": "Чтение", "title": "Огласовки: первые гласные", "subtitle": "Патах, камац, хирик, сеголь, цере", "explanation": "Знаки под/над буквами помогают читать: ַ и ָ обычно дают «а»; ִ — «и»; ֶ и ֵ — «э/е». В современном произношении некоторые исторические различия исчезли. Не пытайся выучить все знаки за один раз.", "hebrew": "אִמָּא", "pron": "има", "translation": "Мама", "question": "Какой знак обычно даёт звук «и»?", "answer": "ִ", "options": ["ַ", "ִ", "ָ"]}, {"id": 8, "section": "Чтение", "title": "Огласовки: о, у и шва", "subtitle": "Холам, кубуц, шурук, шва", "explanation": "ֹ и וֹ обычно дают «о»; ֻ и וּ — «у». Шва ְ может обозначать очень краткий гласный или отсутствие гласного в зависимости от позиции. В обычных израильских текстах эти знаки чаще всего опускают.", "hebrew": "סוּס", "pron": "сус", "translation": "Лошадь", "question": "Какое сочетание часто передаёт «у»?", "answer": "וּ", "options": ["וֹ", "וּ", "ֵ"]}, {"id": 9, "section": "Общение", "title": "Приветствия и вежливость", "subtitle": "Первый короткий диалог", "explanation": "שלום — привет; בוקר טוב — доброе утро; ערב טוב — добрый вечер; תודה — спасибо; בבקשה — пожалуйста; סליחה — извините; להתראות — до свидания. Произноси каждую фразу вслух и используй в мини-диалогах.", "hebrew": "תּוֹדָה", "pron": "тода", "translation": "Спасибо", "question": "Как сказать «спасибо»?", "answer": "תודה", "options": ["סליחה", "תודה", "שלום"]}, {"id": 10, "section": "Общение", "title": "Я, ты, он, она", "subtitle": "Личные местоимения", "explanation": "אני — я; אתה — ты (к мужчине); את — ты (к женщине); הוא — он; היא — она; אנחנו — мы; אתם / אתן — вы (м./ж.); הם / הן — они (м./ж.). В иврите род важен уже на уровне простых фраз.", "hebrew": "אֲנִי", "pron": "ани", "translation": "Я", "question": "Как сказать «я»?", "answer": "אני", "options": ["הוא", "את", "אני"]}, {"id": 11, "section": "Грамматика", "title": "Предложения без «есть»", "subtitle": "Именные предложения в настоящем", "explanation": "В настоящем времени связка «быть» обычно не произносится: אני תלמיד — я ученик (говорит мужчина); אני תלמידה — я ученица (говорит женщина). Отрицание: אני לא תלמיד — я не ученик. Не переносите английское am/is/are буквально.", "hebrew": "אֲנִי תַּלְמִיד", "pron": "ани тальмид", "translation": "Я ученик", "question": "Нужен ли отдельный глагол «есть» в «אני תלמיד»?", "answer": "Нет", "options": ["Да", "Нет", "Только во множественном числе"]}, {"id": 12, "section": "Грамматика", "title": "Род существительных", "subtitle": "Мужской и женский род", "explanation": "Многие существительные женского рода заканчиваются на ה или ת, но есть исключения. Прилагательные и глаголы часто согласуются по роду. תלמיד — ученик; תלמידה — ученица. Запоминай существительное вместе с родом.", "hebrew": "תַּלְמִידָה", "pron": "тальмида", "translation": "Ученица", "question": "Какой вариант означает «ученица»?", "answer": "תלמידה", "options": ["תלמיד", "תלמידה", "תלמידים"]}, {"id": 13, "section": "Грамматика", "title": "Определённый артикль ה־", "subtitle": "«Этот / конкретный» предмет", "explanation": "Артикль ה־ присоединяется к слову: ספר — книга; הספר — эта/конкретная книга, «книга» в определённом значении. Отдельного неопределённого артикля как английское a/an нет.", "hebrew": "הַסֵּפֶר", "pron": "ха-сефер", "translation": "Книга (определённая)", "question": "Как обычно обозначают определённость существительного?", "answer": "ה־", "options": ["ו־", "ה־", "ל־"]}, {"id": 14, "section": "Грамматика", "title": "Множественное число", "subtitle": "Частые окончания ים и ות", "explanation": "Часто мужское множественное число получает ־ים, а женское ־ות: תלמיד → תלמידים, תלמידה → תלמידות. Однако окончания не всегда надёжно указывают на род — есть исключения.", "hebrew": "תַּלְמִידִים", "pron": "тальмидим", "translation": "Ученики", "question": "Какое частое окончание мужского множественного числа?", "answer": "ים", "options": ["ות", "ים", "ה"]}, {"id": 15, "section": "Общение", "title": "Знакомство", "subtitle": "Как представиться", "explanation": "קוראים לי... — меня зовут...; מה השם שלך? — как тебя зовут?; נעים מאוד — очень приятно; אני מאוקראינה — я из Украины. Составь рассказ о себе из 3–4 коротких фраз.", "hebrew": "קוֹרְאִים לִי", "pron": "корим ли", "translation": "Меня зовут", "question": "Что означает «קוראים לי»?", "answer": "Меня зовут", "options": ["Спасибо", "Меня зовут", "Где ты?"]}, {"id": 16, "section": "Грамматика", "title": "Настоящее время глаголов", "subtitle": "Четыре формы по роду и числу", "explanation": "В настоящем времени многие глаголы различают мужской/женский род и единственное/множественное число. Например, לומד (ломед) — учится (м.), לומדת (ломедет) — учится (ж.), לומדים (ломдим) — учатся (м./смеш.), לומדות (ломдот) — учатся (ж.).", "hebrew": "אֲנִי לוֹמֵד עִבְרִית", "pron": "ани ломед иврит", "translation": "Я учу иврит (муж.)", "question": "Как мужчина скажет «я учу»?", "answer": "אני לומד", "options": ["אני לומדת", "אני לומד", "אני לומדים"]}, {"id": 17, "section": "Грамматика", "title": "Отрицание и вопросы", "subtitle": "לא, מה, מי, איפה", "explanation": "לא — не; מה — что; מי — кто; איפה — где; למה — почему; איך — как. В обычных вопросах порядок слов часто похож на утвердительный, а вопросительное слово ставят в подходящую позицию.", "hebrew": "אֵיפֹה הַבַּיִת?", "pron": "эйфо ха-байт?", "translation": "Где дом?", "question": "Как сказать «где»?", "answer": "איפה", "options": ["מי", "מה", "איפה"]}, {"id": 18, "section": "Общение", "title": "Числа 0–10", "subtitle": "Счёт в повседневной жизни", "explanation": "0 אפס (эфес), 1 אחד (эхад), 2 שניים (шнаим), 3 שלוש (шалош), 4 ארבע (арба), 5 חמש (хамеш), 6 שש (шеш), 7 שבע (шева), 8 שמונה (шмоне), 9 תשע (теша), 10 עשר (эсер). Это базовые формы; при счёте предметов формы могут меняться по роду.", "hebrew": "שָׁלוֹשׁ", "pron": "шалош", "translation": "Три (базовая форма)", "question": "Что означает «חמש»?", "answer": "Пять", "options": ["Три", "Пять", "Семь"]}, {"id": 19, "section": "Грамматика", "title": "Предлоги и слитное написание", "subtitle": "ב־, ל־, מ־, ו־", "explanation": "Частые приставки присоединяются к следующему слову: ב־ — в/на; ל־ — к/для; מ־ — из/от; ו־ — и. Например, בישראל — в Израиле; ולומד — и учится. Произношение зависит от контекста.", "hebrew": "בְּיִשְׂרָאֵל", "pron": "бе-Исраэль", "translation": "В Израиле", "question": "Какая приставка часто означает «в»?", "answer": "ב־", "options": ["ל־", "ב־", "ו־"]}, {"id": 20, "section": "Общение", "title": "Семья и дом", "subtitle": "Слова, которые пригодятся с родственниками", "explanation": "משפחה — семья; אמא — мама; אבא — папа; אח — брат; אחות — сестра; בית — дом; סבא — дедушка; סבתא — бабушка. Составь пять фраз о своей семье и попробуй произнести их без подсказки.", "hebrew": "מִשְׁפָּחָה", "pron": "мишпаха", "translation": "Семья", "question": "Как сказать «семья»?", "answer": "משפחה", "options": ["בית", "משפחה", "אחות"]}, {"id": 21, "section": "Грамматика", "title": "Прилагательные и согласование", "subtitle": "Красивый дом, хорошая книга", "explanation": "Прилагательное обычно следует после существительного и согласуется с ним по роду, числу и определённости: בית גדול — большой дом; ילדה גדולה — большая девочка; הבית הגדול — большой дом (определённый).", "hebrew": "בַּיִת גָּדוֹל", "pron": "байт гадоль", "translation": "Большой дом", "question": "Где обычно стоит прилагательное?", "answer": "После существительного", "options": ["Перед существительным", "После существительного", "Всегда в начале"]}, {"id": 22, "section": "Грамматика", "title": "Прошедшее время: введение", "subtitle": "Как рассказать о вчерашнем дне", "explanation": "В прошедшем времени формы глагола меняются по лицу, роду и числу. Например: למדתי — я учил(а); למד — он учил; למדה — она учила. Осваивай сначала частые глаголы в коротких фразах.", "hebrew": "לָמַדְתִּי", "pron": "ламадти", "translation": "Я учил(а)", "question": "Как сказать «я учил(а)»?", "answer": "למדתי", "options": ["למד", "למדתי", "לומד"]}, {"id": 23, "section": "Грамматика", "title": "Будущее время: введение", "subtitle": "Как говорить о планах", "explanation": "Будущее время часто образуется приставками и иногда окончаниями: אלמד — я буду учить; ילמד — он будет учить; תלמד — она будет учить (также «ты» м. в ряде контекстов). Научись распознавать форму до заучивания всей таблицы.", "hebrew": "אֶלְמַד", "pron": "эльмад", "translation": "Я буду учить", "question": "Как сказать «я буду учить»?", "answer": "אלמד", "options": ["למדתי", "אלמד", "לומד"]}, {"id": 24, "section": "Практика", "title": "Диалог в кафе", "subtitle": "Заказ и вежливые просьбы", "explanation": "אני רוצה קפה — я хочу кофе (муж.); אני רוצה תה — я хочу чай; כמה זה עולה? — сколько это стоит?; אפשר מים? — можно воды?; תודה רבה — большое спасибо. Разыграй диалог покупателя и продавца.", "hebrew": "כַּמָּה זֶה עוֹלֶה?", "pron": "кама зе оле?", "translation": "Сколько это стоит?", "question": "Как спросить цену?", "answer": "כמה זה עולה?", "options": ["איפה הבית?", "כמה זה עולה?", "מה השם שלך?"]}, {"id": 25, "section": "Практика", "title": "Итог: первые разговоры", "subtitle": "Самопрезентация и самостоятельное чтение", "explanation": "Проверь себя: прочитай знакомые слова без транскрипции, представься, расскажи о семье, спроси цену и объясни, что изучаешь иврит. После этого переходи к регулярному чтению адаптированных текстов и разговорам с носителями.", "hebrew": "אֲנִי לוֹמֵד עִבְרִית", "pron": "ани ломед иврит", "translation": "Я учу иврит", "question": "Что означает «אני לומד עברית»?", "answer": "Я учу иврит", "options": ["Я живу в Израиле", "Я учу иврит", "Меня зовут"]}];
const key='alef-hebrew-progress-v1';let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){}let current=1,answered=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(key,JSON.stringify([...done]))}catch(e){}}
function renderNav(){document.getElementById('bar').style.width=(done.size/lessons.length*100)+'%';document.getElementById('pct').textContent=`${done.size} из ${lessons.length} уроков завершено · ${Math.round(done.size/lessons.length*100)}%`;let prev='';document.getElementById('navlist').innerHTML=lessons.map(l=>{let header=l.section!==prev?`<div class="group">${esc(l.section)}</div>`:'';prev=l.section;return header+`<button class="nav ${current===l.id?'active':''}" onclick="show(${l.id})">${l.id}. ${esc(l.title)} <span class="check">${done.has(l.id)?'✓':''}</span></button>`}).join('')}
function show(id){current=id;answered=false;const l=lessons[id-1];renderNav();document.getElementById('content').innerHTML=`<div class="eyebrow">Урок ${l.id} / ${lessons.length} · ${esc(l.section)}</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><section class="panel"><h2>Объяснение</h2><p>${esc(l.explanation)}</p><div class="tip">Совет: прочитай объяснение, затем произнеси пример вслух 3 раза и запиши его от руки справа налево.</div></section><section class="panel"><h2>Пример</h2><div class="hebrew" lang="he" dir="rtl">${esc(l.hebrew)}</div><div class="pron">${esc(l.pron)}</div><div class="trans">${esc(l.translation)}</div><div class="actions"><button class="btn secondary" onclick="speak()">▶ Произнести на иврите</button></div><p class="small">Озвучка использует голос устройства, если установлен иврит. Автоматическое произношение может быть неточным.</p></section><section class="panel"><h2>Проверь себя</h2><p>${esc(l.question)}</p><div class="choices">${l.options.map((o,i)=>`<button class="choice" data-option="${i}" onclick="check(${i})">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="actions"><button class="btn secondary" onclick="show(Math.max(1,current-1))" ${id===1?'disabled':''}>← Назад</button><button class="btn" id="complete" onclick="complete()" ${answered||done.has(id)?'':'disabled'}>${done.has(id)?'✓ Урок пройден':'Завершить урок'}</button><button class="btn secondary" onclick="show(Math.min(lessons.length,current+1))" ${id===lessons.length?'disabled':''}>Следующий →</button></div>`;window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('open')}
function check(i){const l=lessons[current-1];const choice=l.options[i];const correct=choice===l.answer;document.querySelectorAll('.choice').forEach(b=>{b.classList.remove('correct','wrong');if(l.options[Number(b.dataset.option)]===l.answer)b.classList.add('correct');else if(Number(b.dataset.option)===i)b.classList.add('wrong')});document.getElementById('feedback').textContent=correct?'Верно! Теперь можно завершить урок.':'Пока неверно. Правильный ответ подсвечен зелёным. Повтори объяснение.';answered=correct;document.getElementById('complete').disabled=!correct}
function complete(){if(!answered&&!done.has(current))return;done.add(current);persist();renderNav();const b=document.getElementById('complete');b.textContent='✓ Урок пройден';b.disabled=false}
function speak(){if(!('speechSynthesis' in window)){alert('На этом устройстве озвучка недоступна.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessons[current-1].hebrew);u.lang='he-IL';u.rate=.78;speechSynthesis.speak(u)}
show(1);
</script></body></html>
